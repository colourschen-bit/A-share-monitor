const f=(n,d=2)=>Number.isFinite(n)?n.toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';function key(x){return(x.m==='HK'?'hk':x.m==='SH'?'sh':'sz')+x.c}function val(x){if(!x.v)return null;let w=x.p.map((p,i)=>p*SC[scenario][1][i]),s=w.reduce((a,b)=>a+b,0),ev=x.v.reduce((a,v,i)=>a+v*w[i]/s,0);return{ev,lo:ev*x.mos[0],hi:ev*x.mos[1]}}function rp(x){return x.price==null?null:x.price*(x.fx||1)}function dec(x){let v=val(x),p=rp(x);if(!v)return['待研究','review'];if(p==null)return['等待行情','review'];if(p<=v.hi&&p>=v.lo)return['进入关注区','watch'];if(p<v.lo)return['低于区间·查错','review'];if(p>v.ev*1.12)return['预期较满','reduce'];return['持有 / 等待','hold']}
function render(){let q=document.getElementById('search').value.trim().toLowerCase(),t=document.getElementById('tier').value,list=state.filter(x=>{let d=dec(x);return(!q||[x.n,x.c,x.thesis,x.model].join(' ').toLowerCase().includes(q))&&(t==='all'||t===x.t||(t==='zone'&&d[0]==='进入关注区')||(t==='broken'&&d[1]==='review'))});rows.innerHTML=list.map(x=>{let v=val(x),d=dec(x);return`<tr data-c="${x.c}"><td><div class="name">${x.n}</div><div class="code">${x.m}${x.c}</div></td><td><span class="pill ${x.t}">${x.t==='core'?'核心研究':'观察研究'}</span></td><td class="num">${f(rp(x),3)}</td><td><span class="pill ${d[1]}">${d[0]}</span></td><td class="num">${v?f(v.lo,2)+'–'+f(v.hi,2):'待研究'}</td><td class="num">${v?f(v.ev,2):'待研究'}</td><td>${x.model}</td><td class="report">${x.report}<div class="code">${x.t==='core'?'研究基准 2026-09-13':'待补研究'}</div></td><td class="thesis">${x.thesis}</td></tr>`}).join('');document.getElementById('count').textContent=`${list.length} / ${state.length} 项`;stats()}
function stats(){let core=state.filter(x=>x.t==='core'),researched=state.filter(x=>val(x)),zone=state.filter(x=>dec(x)[0]==='进入关注区'),full=state.filter(x=>dec(x)[0]==='预期较满'),check=state.filter(x=>dec(x)[0]==='低于区间·查错');document.getElementById('stats').innerHTML=[['研究标的',state.length+' 项',''],['核心研究',core.length+' 项',''],['已有情景模型',researched.length+' 项','good'],['进入关注区',zone.length+' 项','warn'],['预期较满',full.length+' 项','bad'],['低于区间待查错',check.length+' 项','bad']].map(a=>`<div class="stat"><small>${a[0]}</small><strong class="${a[2]}">${a[1]}</strong></div>`).join('')}
function openD(x){let v=val(x),d=dec(x);document.getElementById('dCode').textContent=`${x.m}${x.c} · ${x.t==='core'?'核心研究层':'观察研究层'}`;document.getElementById('dName').textContent=x.n;document.getElementById('dBody').innerHTML=`<div class="grid"><div class="card"><small>当前折算价</small><strong>${f(rp(x),3)}</strong></div><div class="card"><small>动态关注区 · ${SC[scenario][0]}</small><strong>${v?f(v.lo,2)+'–'+f(v.hi,2):'待研究'}</strong></div><div class="card"><small>决策状态</small><strong class="${d[1]==='hold'?'good':d[1]==='watch'?'warn':'bad'}">${d[0]}</strong></div></div>${v?`<div class="section"><h3>独立估值模型</h3><p>${x.model}</p></div><div class="grid section">${['熊','基准','牛'].map((s,i)=>`<div class="card"><small>${s}市价值 / 原始概率</small><strong>${f(x.v[i],2)} / ${f(x.p[i]*100,0)}%</strong></div>`).join('')}</div>`:''}<div class="section"><h3>最新财报 / 数据事实</h3><p>${x.report}</p></div><div class="section"><h3>反身性判断</h3><p>${x.thesis}</p></div>${x.ok?`<div class="conditions section"><div class="card"><small class="good">区间成立条件</small>${x.ok}</div><div class="card"><small class="bad">论点失效 / 暂停关注</small>${x.bad}</div></div>`:''}${x.source?`<div class="section"><a class="source" href="${x.source}" target="_blank">查看原始披露 / 官方数据源 ↗</a></div>`:''}<div class="method">动态关注区 = 情景概率加权价值 × 该资产独立安全边际。低于区间不自动等于买入，必须先排查是否因基本面恶化而成为价值陷阱。港股暂按0.8551折算人民币。</div>`;detail.showModal()}
function refresh(){document.getElementById('status').textContent='正在刷新腾讯行情…';let o=document.getElementById('qs');if(o)o.remove();let s=document.createElement('script');s.id='qs';s.charset='gbk';s.src='https://qt.gtimg.cn/q='+state.map(key).join(',');s.onload=()=>{state=state.map(x=>{let r=window['v_'+key(x)];if(!r)return x;let a=String(r).split('~');return{...x,price:Number(a[3])||x.price}});document.getElementById('status').textContent='行情已刷新 · 港股按0.8551折算人民币 · 研究基准日 2026-09-13';render()};s.onerror=()=>{document.getElementById('status').textContent='行情刷新失败；研究内容仍可查看';render()};document.body.appendChild(s)}
rows.onclick=e=>{let tr=e.target.closest('tr');if(tr)openD(state.find(x=>x.c===tr.dataset.c))};document.getElementById('closeBtn').onclick=()=>detail.close();document.getElementById('search').oninput=render;document.getElementById('tier').onchange=render;document.getElementById('scenarioBtn').onclick=e=>{scenario=(scenario+1)%3;e.target.textContent='情景：'+SC[scenario][0];render()};document.getElementById('refreshBtn').onclick=refresh;render();refresh();
</script></body></html>
